<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Viewer - Credit Risk Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .query-result { 
            max-height: 500px; 
            overflow-y: auto; 
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }
        .table-container { 
            margin-top: 20px; 
        }
        pre { 
            background: #f8f9fa; 
            padding: 10px; 
            border-radius: 5px; 
        }
        .sidebar {
            background-color: #f8f9fa;
            min-height: 100vh;
            padding: 20px;
        }
        .table-list {
            list-style: none;
            padding: 0;
        }
        .table-list li {
            padding: 8px;
            margin: 2px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
        }
        .table-list li:hover {
            background-color: #e9ecef;
        }
        .sql-editor {
            font-family: 'Courier New', monospace;
            min-height: 150px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar with database schema -->
            <div class="col-md-3 sidebar">
                <h4>📊 Database Schema</h4>
                <p class="text-muted">Click a table to view its structure</p>
                <ul class="table-list" id="tableList">
                    <li>Loading tables...</li>
                </ul>
                
                <hr>
                <h5>Quick Queries</h5>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary btn-sm" onclick="runQuickQuery('companies')">View All Companies</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="runQuickQuery('sic_codes')">View SIC Codes</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="runQuickQuery('predictions')">View Predictions</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="runQuickQuery('confidence')">Confidence Analysis</button>
                </div>
            </div>
            
            <!-- Main content area -->
            <div class="col-md-9">
                <div class="container-fluid p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2>🗄️ SQLite Database Viewer</h2>
                        <div>
                            <span class="badge bg-success" id="dbBadge">Loading...</span>
                            <a href="/" class="btn btn-outline-secondary ms-2">← Back to Dashboard</a>
                        </div>
                    </div>
                    
                    <!-- SQL Query Interface -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">SQL Query Editor</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <textarea class="form-control sql-editor" id="sqlQuery" placeholder="Enter your SQL query here...
Example: SELECT * FROM companies LIMIT 10;"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" onclick="executeQuery()">
                                    <i class="fas fa-play"></i> Execute Query
                                </button>
                                <button class="btn btn-outline-secondary" onclick="clearQuery()">Clear</button>
                                <button class="btn btn-outline-info" onclick="formatQuery()">Format SQL</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Results Area -->
                    <div class="card">
                        <div class="card-header d-flex justify-content-between">
                            <h5 class="mb-0">Query Results</h5>
                            <span class="badge bg-light text-dark" id="resultCount">Ready</span>
                        </div>
                        <div class="card-body">
                            <div id="queryResults">
                                <p class="text-muted">Execute a query to see results here.</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Database Statistics -->
                    <div class="row mt-4">
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Companies</h5>
                                    <h2 class="text-primary" id="companyCount">-</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body text-center">
                                    <h5 class="card-title">SIC Codes</h5>
                                    <h2 class="text-success" id="sicCount">-</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body text-center">
                                    <h5 class="card-title">DB Size</h5>
                                    <h2 class="text-info" id="dbSize">-</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Detect which database to show based on URL param
        const DB_PARAM = new URLSearchParams(window.location.search).get('db') || 'main';

        // Database viewer functionality
        class DatabaseViewer {
            constructor() {
                this.loadTables();
                this.loadStatistics();
            }
            
            async loadTables() {
                try {
                    const response = await fetch(`/api/database/tables?db=${DB_PARAM}`);
                    const tables = await response.json();
                    this.displayTables(tables);
                } catch (error) {
                    console.error('Error loading tables:', error);
                }
            }
            
            displayTables(tables) {
                const tableList = document.getElementById('tableList');
                tableList.innerHTML = '';
                
                tables.forEach(table => {
                    const li = document.createElement('li');
                    li.textContent = table.name;
                    li.onclick = () => this.showTableSchema(table.name);
                    tableList.appendChild(li);
                });
            }
            
            async showTableSchema(tableName) {
                try {
                    const response = await fetch(`/api/database/schema/${tableName}?db=${DB_PARAM}`);
                    const schema = await response.json();
                    this.displaySchema(tableName, schema);
                } catch (error) {
                    console.error('Error loading schema:', error);
                }
            }
            
            displaySchema(tableName, schema) {
                const queryArea = document.getElementById('sqlQuery');
                queryArea.value = `-- Schema for ${tableName}\n-- ${schema.columns.map(col => `${col.name}: ${col.type}`).join(', ')}\n\nSELECT * FROM ${tableName} LIMIT 10;`;
            }
            
            async loadStatistics() {
                try {
                    const response = await fetch('/api/database/statistics');
                    const stats = await response.json();
                    
                    document.getElementById('companyCount').textContent = stats.companies || '-';
                    document.getElementById('sicCount').textContent = stats.sic_codes || '-';
                    document.getElementById('dbSize').textContent = stats.db_size || '-';
                } catch (error) {
                    console.error('Error loading statistics:', error);
                }
            }
        }
        
        // Query execution
        async function executeQuery() {
            const query = document.getElementById('sqlQuery').value.trim();
            if (!query) {
                alert('Please enter a SQL query');
                return;
            }
            
            const resultDiv = document.getElementById('queryResults');
            const countBadge = document.getElementById('resultCount');
            
            resultDiv.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"></div><br>Executing query...</div>';
            countBadge.textContent = 'Executing...';
            
            try {
                const response = await fetch('/api/database/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, db: DB_PARAM })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result.data, result.columns);
                    countBadge.textContent = `${result.row_count} rows`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${result.error}</div>`;
                    countBadge.textContent = 'Error';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Network error: ${error.message}</div>`;
                countBadge.textContent = 'Error';
            }
        }
        
        function displayResults(data, columns) {
            const resultDiv = document.getElementById('queryResults');
            
            if (!data || data.length === 0) {
                resultDiv.innerHTML = '<div class="alert alert-info">No results found</div>';
                return;
            }
            
            let html = '<div class="query-result"><table class="table table-striped table-hover"><thead class="table-dark"><tr>';
            
            // Headers
            columns.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            // Data rows
            data.forEach(row => {
                html += '<tr>';
                columns.forEach(col => {
                    const value = row[col];
                    html += `<td>${value !== null && value !== undefined ? String(value) : '<em>NULL</em>'}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            resultDiv.innerHTML = html;
        }
        
        // Quick query functions
        function runQuickQuery(type) {
            const mainQueries = {
                'companies':   'SELECT company_name, company_number, status, country, jurisdiction, incorporation_date FROM companies LIMIT 20;',
                'sic_codes':   'SELECT sic_code, sic_description, section, division FROM sic_codes ORDER BY sic_code LIMIT 20;',
                'predictions': 'SELECT id, company_name, predicted_sic_code, predicted_sic_description, confidence_score, prediction_timestamp FROM sic_prediction_history ORDER BY prediction_timestamp DESC LIMIT 20;',
                'confidence':  'SELECT company_name, predicted_sic_code, confidence_score, prediction_method, prediction_timestamp FROM sic_prediction_history WHERE confidence_score IS NOT NULL ORDER BY confidence_score DESC LIMIT 15;'
            };
            const vectorQueries = {
                'companies':   'SELECT document_id, company_name, company_number, filing_date, document_type FROM documents_v2 ORDER BY filing_date DESC LIMIT 20;',
                'sic_codes':   'SELECT dc.chunk_id, dc.document_id, d.company_name, dc.chunk_index, substr(dc.content, 1, 120) as content_preview FROM document_chunks_v2 dc JOIN documents_v2 d ON dc.document_id = d.document_id LIMIT 20;',
                'predictions': 'SELECT company_name, COUNT(*) as doc_count FROM documents_v2 GROUP BY company_name ORDER BY doc_count DESC LIMIT 20;',
                'confidence':  'SELECT document_id, COUNT(*) as chunks FROM document_chunks_v2 GROUP BY document_id ORDER BY chunks DESC LIMIT 20;'
            };
            const queries = DB_PARAM === 'vector' ? vectorQueries : mainQueries;
            document.getElementById('sqlQuery').value = queries[type] || '';
        }
        
        function clearQuery() {
            document.getElementById('sqlQuery').value = '';
            document.getElementById('queryResults').innerHTML = '<p class="text-muted">Execute a query to see results here.</p>';
            document.getElementById('resultCount').textContent = 'Ready';
        }
        
        function formatQuery() {
            const query = document.getElementById('sqlQuery').value;
            // Simple SQL formatting
            const formatted = query
                .replace(/SELECT/gi, 'SELECT')
                .replace(/FROM/gi, '\nFROM')
                .replace(/WHERE/gi, '\nWHERE')
                .replace(/ORDER BY/gi, '\nORDER BY')
                .replace(/GROUP BY/gi, '\nGROUP BY')
                .replace(/LIMIT/gi, '\nLIMIT');
            
            document.getElementById('sqlQuery').value = formatted;
        }
        
        // Initialize viewer
        document.addEventListener('DOMContentLoaded', () => {
            new DatabaseViewer();
            // Set badge
            const badge = document.getElementById('dbBadge');
            if (badge) badge.textContent = DB_PARAM === 'vector' ? 'Vector DB' : 'Main DB';
            // Update quick-query button labels for vector DB
            if (DB_PARAM === 'vector') {
                const vectorLabels = ['View Documents', 'View Chunk Previews', 'Docs per Company', 'Chunks per Document'];
                document.querySelectorAll('.d-grid.gap-2 button').forEach((btn, i) => {
                    if (vectorLabels[i]) btn.textContent = vectorLabels[i];
                });
            }
            // Add switch link
            const switchLink = document.createElement('a');
            switchLink.href = DB_PARAM === 'vector' ? '/database-viewer' : '/database-viewer?db=vector';
            switchLink.className = 'btn btn-outline-warning ms-2 btn-sm';
            switchLink.textContent = DB_PARAM === 'vector' ? '⇄ Main DB' : '⇄ Vector DB';
            const btnGroup = document.querySelector('.d-flex.justify-content-between > div');
            if (btnGroup) btnGroup.insertBefore(switchLink, btnGroup.firstChild);
        });
    </script>
</body>
</html>
